[package]
name = "seismic"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "seismic"
path = "src/main.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.16"
ndarray-npy = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
